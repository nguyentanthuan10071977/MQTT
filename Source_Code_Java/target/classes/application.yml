spring:
  datasource:
    url: jdbc:h2:mem:smartlocker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
server:
  port: 8080
app:
  jwt:
    secret: change-this-development-secret-to-at-least-32-characters
    expiration-hours: 24